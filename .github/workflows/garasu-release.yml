name: Garasu installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'files/**'
      - 'scripts/build_release.py'
      - 'scripts/exe_icon.py'
      - '.github/workflows/garasu-release.yml'
  push:
    branches: [main]
    paths:
      - 'files/theme/version.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate release version
        if: github.event_name == 'push'
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath 'files/theme/version.txt').Trim()
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$') {
            throw 'Expected a release version such as 1.5 or 1.5.1.'
          }
          "tag=Garasu_v$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify the installer
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install Pillow==12.0.0
          python scripts/build_release.py --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garasu-installer
          path: |
            dist/Garasu.exe
            dist/Garasu.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: garasu-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: garasu-installer
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GARASU_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          cd dist
          sha256sum Garasu.exe Garasu.zip > SHA256SUMS.txt
          gh release create "$GARASU_TAG" Garasu.exe Garasu.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Garasu ${GARASU_TAG#Garasu_v}" --generate-notes
