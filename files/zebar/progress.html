<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .box { width: 296px; margin: 2px; padding: 14px 18px 12px 18px; opacity: var(--opacity, 1); }
  .tag { font-size: 11px; letter-spacing: 1.8px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 62px 1fr 46px; align-items: center; gap: 10px; height: 34px; }
  .name { font-size: 13px; font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: var(--line, rgba(255, 255, 255, 0.14)); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--glow));
          transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
  .pct { font: 700 15px 'Space Grotesk', sans-serif; text-align: right; color: var(--glow); }
  .dots { display: grid; grid-template-columns: repeat(26, 1fr); gap: 3px; margin-top: 10px; }
  .dots i { aspect-ratio: 1; border-radius: 50%; background: var(--line, rgba(255, 255, 255, 0.14)); }
  .dots i.on { background: var(--accent); }
  .dots i.now { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
</style>
</head>
<body data-widget="progress" data-w="300">
<div class="box card-bg shadow" id="box">
  <div class="tag">ПРОГРЕСС</div>
  <div id="rows"></div>
  <div class="dots" id="dots"></div>
</div>
<script type="module">
  import './common.js';
  // Сколько прошло от дня, недели, месяца и года. Внизу - 52 точки, по одной на неделю года.
  const rows = [['day', 'День'], ['week', 'Неделя'], ['month', 'Месяц'], ['year', 'Год']];
  const box = document.getElementById('rows');
  for (const [k, t] of rows) box.insertAdjacentHTML('beforeend',
    `<div class="row" id="r-${k}"><div class="name">${t}</div><div class="bar"><div class="fill"></div></div><div class="pct"></div></div>`);
  const dots = document.getElementById('dots');
  for (let i = 0; i < 52; i++) dots.appendChild(document.createElement('i'));
  let cfg = {};
  function part(a, b, n) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
  function tick() {
    const n = new Date(), y = n.getFullYear(), m = n.getMonth(), d = n.getDate();
    const d0 = new Date(y, m, d), wd = (n.getDay() + 6) % 7, w0 = new Date(y, m, d - wd);
    const v = {
      day: part(d0, new Date(y, m, d + 1), n),
      week: part(w0, new Date(y, m, d - wd + 7), n),
      month: part(new Date(y, m, 1), new Date(y, m + 1, 1), n),
      year: part(new Date(y, 0, 1), new Date(y + 1, 0, 1), n),
    };
    for (const [k] of rows) {
      const r = document.getElementById('r-' + k);
      r.style.display = cfg[k] === false ? 'none' : '';
      r.querySelector('.fill').style.width = (v[k] * 100).toFixed(1) + '%';
      r.querySelector('.pct').textContent = Math.floor(v[k] * 100) + '%';
    }
    const wk = Math.min(51, Math.floor(v.year * 52));
    [...dots.children].forEach((el, i) => el.className = i < wk ? 'on' : i === wk ? 'now' : '');
    dots.style.display = cfg.dots === false ? 'none' : '';
  }
  document.addEventListener('config', e => {
    cfg = e.detail;
    document.getElementById('box').classList.toggle('card-bg', cfg.card !== false);
    tick();
  });
  tick();
  setInterval(tick, 30000);
</script>
</body>
</html>
