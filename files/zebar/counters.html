<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .box { width: 296px; margin: 2px; padding: 14px 18px 10px 18px; opacity: var(--opacity, 1); }
  .tag { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 14px; height: 62px; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.12); }
  .n { font: 700 40px 'Space Grotesk', sans-serif; letter-spacing: -1.5px; color: var(--glow); min-width: 92px; text-align: right; line-height: 1; }
  .row.future .n { color: var(--accent); }
  .txt { min-width: 0; }
  .unit { font-size: 12px; color: var(--muted); font-weight: 600; }
  .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { font-size: 12px; color: var(--muted); padding: 10px 0; line-height: 1.4; }
</style>
</head>
<body data-widget="counters" data-w="300">
<div class="box card-bg shadow" id="box">
  <div class="tag">СЧЁТЧИКИ</div>
  <div id="list"></div>
</div>
<script type="module">
  import './common.js';
  // Счётчики дней: сколько прошло с даты или сколько осталось до неё. Даты задаются в настройках виджета.
  let items = [], day = '';
  const plural = n => { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? 'дней' : k === 1 ? 'день' : k >= 2 && k <= 4 ? 'дня' : 'дней'; };
  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    day = t0.toDateString();
    for (const it of items) {
      const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((it.date || '').trim());
      if (!m || !it.title) continue;
      const n = Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - t0) / 86400000);
      const row = document.createElement('div');
      row.className = 'row' + (n > 0 ? ' future' : '');
      row.innerHTML = '<div class="n"></div><div class="txt"><div class="unit"></div><div class="name"></div></div>';
      row.querySelector('.n').textContent = n === 0 ? '0' : Math.abs(n);
      row.querySelector('.unit').textContent = n === 0 ? 'сегодня' : n > 0 ? plural(n) + ' до' : plural(n);
      row.querySelector('.name').textContent = it.title;
      list.appendChild(row);
    }
    if (!list.children.length) list.innerHTML = '<div class="hint">Добавь дату в настройках виджета: название и день в виде 2027-01-12.</div>';
  }
  document.addEventListener('config', e => {
    items = Array.isArray(e.detail.items) ? e.detail.items : [];
    document.getElementById('box').classList.toggle('card-bg', e.detail.card !== false);
    render();
  });
  render();
  setInterval(() => { if (new Date().toDateString() !== day) render(); }, 60000);   // после полуночи числа сдвигаются
</script>
</body>
</html>
