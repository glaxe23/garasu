<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 14px; }
  .box { width: 336px; padding: 16px 16px 12px 16px; opacity: var(--opacity, 1); border-radius: 18px; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .tag { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; }
  .note { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .count { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; color: var(--fg); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: rgba(255, 255, 255, 0.08); }
  .chk { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 5px; border: 2px solid var(--accent); }
  .item.done .chk { background: var(--accent); }
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .txt { line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more, .empty { font-size: 12px; color: var(--muted); padding: 6px; }
  .bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.5s; }
</style>
</head>
<body data-widget="tasks" data-w="340">
<div class="box card-bg shadow" id="box">
  <div class="head">
    <span class="tag">ЗАДАЧИ</span>
    <span class="note" id="note"></span>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
  <div class="bar"><i id="bar"></i></div>
</div>
<script type="module">
  import { read, exec, tools, isSelected } from './common.js';
  let cfg = { count: 8, done: false, card: true }, data = null, last = '';

  function render() {
    const box = document.getElementById('box');
    box.classList.toggle('card-bg', cfg.card !== false);
    if (!data) return;
    document.getElementById('note').textContent = data.note || '';
    const total = data.open + data.done;
    document.getElementById('count').textContent = total ? data.done + ' / ' + total : '';
    document.getElementById('bar').style.width = total ? (data.done / total * 100) + '%' : '0';
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (data.error) { list.innerHTML = '<div class="empty"></div>'; list.firstChild.textContent = data.error; return; }
    let items = data.items.filter(i => cfg.done || !i.done);
    items = [...items.filter(i => !i.done), ...items.filter(i => i.done)];
    const shown = items.slice(0, cfg.count || 8);
    for (const it of shown) {
      const row = document.createElement('div');
      row.className = 'item click' + (it.done ? ' done' : '');
      row.innerHTML = '<span class="chk"></span><span class="txt"></span>';
      row.lastChild.textContent = it.text;
      row.onclick = () => toggle(it, row);
      list.appendChild(row);
    }
    if (!shown.length) list.innerHTML = '<div class="empty">Все задачи выполнены. Новые добавь в заметку.</div>';
    if (items.length > shown.length) {
      const m = document.createElement('div');
      m.className = 'more';
      m.textContent = 'и ещё ' + (items.length - shown.length);
      list.appendChild(m);
    }
  }

  async function toggle(it, row) {
    if (isSelected()) return;                 // пока виджет выделен для переноса, клики по задачам не считаются
    row.classList.toggle('done');
    try { await exec([tools.tasks, 'toggle', String(it.line)]); } catch (e) { console.error(e); }
    load();
  }

  async function load() {
    try {
      const txt = await read('tasks.json');
      if (txt && txt !== last) { last = txt; data = JSON.parse(txt); render(); }
    } catch (e) {}
  }
  document.addEventListener('config', e => { cfg = { ...cfg, ...e.detail }; render(); });
  load();
  setInterval(load, 2000);
</script>
</body>
</html>
