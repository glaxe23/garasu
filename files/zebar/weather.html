<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .box { width: 296px; height: 146px; margin: 2px; padding: 14px 18px; opacity: var(--opacity, 1);
         display: flex; align-items: center; gap: 16px; }
  svg { width: 78px; height: 78px; flex: none; stroke: var(--glow); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  svg .fill { fill: var(--accent); stroke: none; }
  svg .acc { stroke: var(--accent); }
  .col { min-width: 0; }
  .tag { font-size: 11px; letter-spacing: 1.8px; color: var(--accent); font-weight: 700; }
  .temp { font: 700 50px 'Space Grotesk', sans-serif; line-height: 1.05; letter-spacing: -2px; }
  .temp sup { font-size: 22px; letter-spacing: 0; vertical-align: top; position: relative; top: 8px; margin-left: 2px; }
  .st { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wind { font-size: 12px; color: var(--muted); margin-top: 1px; }
</style>
</head>
<body data-widget="weather" data-w="300">
<div class="box card-bg shadow" id="box">
  <svg viewBox="0 0 64 64" id="icon"></svg>
  <div class="col">
    <div class="tag">ПОГОДА</div>
    <div class="temp"><span id="t">–</span><sup>°C</sup></div>
    <div class="st" id="st">загружаю…</div>
    <div class="wind" id="wind"></div>
  </div>
</div>
<script type="module">
  import './common.js';
  import * as zebar from './zebar.mjs';
  // Погоду даёт сам Zebar: место определяется по интернет-адресу, обновление раз в час.
  const SUN = '<circle class="acc" cx="32" cy="32" r="11"/><path class="acc" d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M49 15l-4 4M19 45l-4 4"/>';
  const MOON = '<path class="acc" d="M42 38A16 16 0 0 1 26 16a16 16 0 1 0 16 22z"/>';
  const CLOUD = '<path d="M20 46h26a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0 0 17z"/>';
  const SMALL_SUN = '<circle class="acc" cx="46" cy="18" r="7"/><path class="acc" d="M46 5v3M59 18h-3M55 9l-2 2"/>';
  const SMALL_MOON = '<path class="acc" d="M54 20a9 9 0 0 1-9-12 9 9 0 1 0 9 12z"/>';
  const RAIN = '<path class="acc" d="M24 52l-2 6M33 52l-2 6M42 52l-2 6"/>';
  const HEAVY = '<path class="acc" d="M22 51l-3 8M30 51l-3 8M38 51l-3 8M46 51l-3 8"/>';
  const SNOW = '<circle class="fill" cx="24" cy="55" r="2.2"/><circle class="fill" cx="33" cy="58" r="2.2"/><circle class="fill" cx="42" cy="55" r="2.2"/>';
  const BOLT = '<path class="fill" d="M35 46l-8 10h6l-3 8 9-11h-6z"/>';
  const UP = '<g transform="translate(0,-6)">' + CLOUD + '</g>';
  const MAP = {
    clear_day: [SUN, 'ясно'], clear_night: [MOON, 'ясная ночь'],
    cloudy_day: [SMALL_SUN + CLOUD, 'облачно'], cloudy_night: [SMALL_MOON + CLOUD, 'облачно'],
    light_rain_day: [UP + RAIN, 'небольшой дождь'], light_rain_night: [UP + RAIN, 'небольшой дождь'],
    heavy_rain_day: [UP + HEAVY, 'сильный дождь'], heavy_rain_night: [UP + HEAVY, 'сильный дождь'],
    snow_day: [UP + SNOW, 'снег'], snow_night: [UP + SNOW, 'снег'],
    thunder_day: [UP + BOLT, 'гроза'], thunder_night: [UP + BOLT, 'гроза'],
  };
  const $ = id => document.getElementById(id);
  const providers = zebar.createProviderGroup({ weather: { type: 'weather', refreshInterval: 3600000 } });
  function render() {
    const w = providers.outputMap.weather;
    if (!w) return;
    const [icon, text] = MAP[w.status] || [CLOUD, ''];
    $('icon').innerHTML = icon;
    $('t').textContent = Math.round(w.celsiusTemp);
    $('st').textContent = text;
    $('wind').textContent = w.windSpeed != null ? 'ветер ' + Math.round(w.windSpeed) + ' км/ч' : '';
  }
  // при входе в Windows сеть бывает ещё не готова: без этого погода висела бы на «загружаю…» до следующего часа
  let got = false, retry = null, wait = 60000;
  function again() {
    if (retry) return;
    if (!got) $('st').textContent = 'нет связи, попробую ещё';
    retry = setTimeout(() => { retry = null; providers.restartAll?.(); }, wait);
    wait = Math.min(wait * 2, 600000);
  }
  providers.onOutput(() => { got = true; wait = 60000; render(); });
  providers.onError?.(again);
  setTimeout(() => { if (!got) again(); }, 30000);
  document.addEventListener('config', e => $('box').classList.toggle('card-bg', e.detail.card !== false));
  $('icon').innerHTML = CLOUD;
</script>
</body>
</html>
