<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 13px; }
  .box { width: 326px; margin: 2px; padding: 16px 16px 12px 16px; opacity: var(--opacity, 1); border-radius: 18px; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .tag { font-size: 10px; letter-spacing: 2px; color: var(--accent); font-weight: 700; }
  .month { flex: 1; font-weight: 700; font-size: 14px; }
  .nav { font: 700 16px 'Segoe UI'; color: var(--accent); cursor: pointer; padding: 0 7px; border-radius: 6px; }
  .nav:hover { background: rgba(255, 255, 255, 0.12); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
  .wd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 4px; }
  .day { position: relative; height: 30px; display: flex; align-items: center; justify-content: center;
         font-family: 'Space Grotesk', sans-serif; font-weight: 500; cursor: pointer; border-radius: 15px; }
  .day:hover { background: rgba(255, 255, 255, 0.10); }
  .day.out { color: var(--muted); opacity: 0.6; }
  .day.today { background: var(--accent); color: var(--pill); font-weight: 700; }
  .day.sel { box-shadow: inset 0 0 0 1px var(--accent); }
  .day.note::after { content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 2px; background: var(--accent); }
  .day.today.note::after { background: var(--pill); }
  .line { height: 1px; background: rgba(255, 255, 255, 0.14); margin: 10px 0 8px 0; }
  .item { display: flex; gap: 8px; padding: 3px 2px; line-height: 1.3; }
  .item b { flex: none; width: 74px; color: var(--accent); font-weight: 700; font-size: 12px; }
  .item span { flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hint { color: var(--muted); font-size: 12px; padding: 3px 2px; }
</style>
</head>
<body data-widget="calendar" data-w="330">
<div class="box card-bg shadow" id="box">
  <div class="head">
    <span class="tag">КАЛЕНДАРЬ</span>
    <span class="month" id="month"></span>
    <span class="nav click" id="prev">‹</span><span class="nav click" id="next">›</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="line"></div>
  <div id="list"></div>
</div>
<script type="module">
  import { read, exec, tools, isSelected } from './common.js';
  const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  let notes = {}, last = '', view = new Date(), sel = null, shownDay = iso(new Date());

  function render() {
    const today = new Date(), y = view.getFullYear(), m = view.getMonth();
    document.getElementById('month').textContent = MONTHS[m] + ' ' + y;
    const grid = document.getElementById('grid');
    grid.innerHTML = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(s => '<div class="wd">' + s + '</div>').join('');
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), key = iso(d);
      if (i >= 35 && d.getMonth() !== m && d.getDate() <= 7 && i % 7 === 0) break;      // шестая строка не нужна
      const el = document.createElement('div');
      el.className = 'day click' + (d.getMonth() !== m ? ' out' : '') + (key === iso(today) ? ' today' : '') +
                     (notes[key] ? ' note' : '') + (key === sel ? ' sel' : '');
      el.textContent = d.getDate();
      el.title = notes[key] || 'Правый клик - заметка';
      el.onclick = () => { sel = key; render(); };
      el.oncontextmenu = e => { e.preventDefault(); sel = key; render(); edit(key); };
      grid.appendChild(el);
    }
    // ниже: заметка выбранного дня или ближайшие заметки
    const list = document.getElementById('list');
    list.innerHTML = '';
    const add = (when, text) => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<b></b><span></span>';
      row.firstChild.textContent = when;
      row.lastChild.textContent = text;
      list.appendChild(row);
    };
    const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const label = key => {
      const [yy, mm, dd] = key.split('-').map(Number), n = Math.round((new Date(yy, mm - 1, dd) - t0) / 86400000);
      return n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n > 1 && n < 7 ? 'через ' + n + ' дн.' : dd + ' ' + GEN[mm - 1];
    };
    if (sel && notes[sel]) add(label(sel), notes[sel]);
    const next = Object.keys(notes).filter(k => k >= iso(today) && k !== sel).sort().slice(0, sel && notes[sel] ? 2 : 3);
    for (const k of next) add(label(k), notes[k]);
    if (!list.children.length) list.innerHTML = '<div class="hint">Заметок нет. Правый клик по числу - написать.</div>';
  }

  async function edit(key) {
    if (isSelected() || !tools || !tools.calendar) return;
    try { await exec([tools.calendar, key]); } catch (e) { console.error(e); }
    load();
  }
  async function load() {
    try {
      const txt = await read('calendar_notes.json');
      if (txt && txt !== last) { last = txt; notes = JSON.parse(txt); render(); }
    } catch (e) {}
    if (iso(new Date()) !== shownDay) { shownDay = iso(new Date()); view = new Date(); render(); }   // наступил новый день
  }
  const shift = n => { view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); };
  document.getElementById('prev').onclick = () => shift(-1);
  document.getElementById('next').onclick = () => shift(1);
  document.addEventListener('config', e => document.getElementById('box').classList.toggle('card-bg', e.detail.card !== false));
  render();
  load();
  setInterval(load, 2000);
</script>
</body>
</html>
