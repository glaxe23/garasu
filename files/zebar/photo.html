<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./common.css" />
<style>
  .ph {
    position: relative; width: 296px; height: 396px; margin: 2px;
    border-radius: 16px; overflow: hidden; opacity: var(--opacity, 1);
  }
  .ph.border { border: 8px solid rgba(255, 255, 255, 0.16); outline: 1px solid rgba(255, 255, 255, 0.30); outline-offset: -1px; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s; -webkit-user-drag: none; }
  .ph img.on { opacity: 1; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
           padding: 24px; font: 500 13px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; color: var(--muted); }
</style>
</head>
<body data-widget="photo" data-w="300">
<div class="ph border card-bg" id="ph">
  <div class="empty" id="empty">Положи картинки в папку<br>C:\garasu\photos</div>
  <img id="a" alt=""><img id="b" alt="">
</div>
<script type="module">
  import { read } from './common.js';
  let files = [], last = '', idx = -1, front = 'a', timer = null, interval = 30;

  function next() {
    if (!files.length) return;
    idx = (idx + 1) % files.length;
    const back = front === 'a' ? 'b' : 'a';
    const img = document.getElementById(back);
    img.onload = () => {
      img.classList.add('on');
      document.getElementById(front).classList.remove('on');
      front = back;
    };
    img.src = './' + files[idx];
  }
  function restart() {
    clearInterval(timer);
    timer = setInterval(next, Math.max(5, interval) * 1000);
  }
  async function load() {
    try {
      const txt = await read('photos.json');
      if (txt && txt !== last) {
        last = txt;
        files = JSON.parse(txt).files || [];
        document.getElementById('empty').style.display = files.length ? 'none' : '';
        idx = -1;
        next();
      }
    } catch (e) {}
  }
  document.addEventListener('config', e => {
    document.getElementById('ph').classList.toggle('border', e.detail.border !== false);
    if (e.detail.interval && e.detail.interval !== interval) { interval = e.detail.interval; restart(); }
  });
  load();
  setInterval(load, 4000);
  restart();
</script>
</body>
</html>
